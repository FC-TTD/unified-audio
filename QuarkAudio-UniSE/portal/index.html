<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>降噪与人声提取</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#d9dee8; --brand:#3157d5; --bg:#f3f6fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    header { padding:20px 28px 14px; background:#fff; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 8px; font-size:24px; }
    .subtitle { color:var(--muted); line-height:1.6; }
    .tabs { display:flex; gap:10px; padding:14px 22px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
    button { border:1px solid var(--line); background:#fff; color:var(--ink); padding:10px 18px; border-radius:10px; cursor:pointer; font-weight:650; }
    button.active { background:var(--brand); border-color:var(--brand); color:#fff; }
    .panel { display:none; padding:14px; }
    .panel.active { display:block; }
    .note { margin:0 8px 12px; padding:12px 14px; border-radius:10px; background:#fff; border:1px solid var(--line); color:var(--muted); line-height:1.6; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
    .chip { padding:5px 9px; border-radius:999px; background:#eef2ff; color:#3448a5; font-size:13px; font-weight:650; }
    iframe { width:100%; height:calc(100vh - 190px); min-height:760px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    a { color:var(--brand); }
  </style>
</head>
<body>
  <header>
    <h1>降噪与人声提取</h1>
    <div class="subtitle">两个模型，同一素材可直接对比试听。</div>
  </header>
  <nav class="tabs">
    <button class="active" data-target="clearvoice">ClearVoice｜快速保真</button>
    <button data-target="unise">UniSE｜重度修复</button>
  </nav>
  <main>
    <section id="clearvoice" class="panel active">
      <div class="note">
        <div class="chips"><span class="chip">日常降噪</span><span class="chip">人声分离</span><span class="chip">目标人声</span><span class="chip">48 kHz 增强</span></div>
        快、保真优先。<a href="http://ttd-edge:17875/" target="_blank" rel="noreferrer">单独打开</a>
      </div>
      <iframe src="http://ttd-edge:17875/" title="ClearVoice"></iframe>
    </section>
    <section id="unise" class="panel">
      <div class="note">
        <div class="chips"><span class="chip">重度修复</span><span class="chip">目标人声</span><span class="chip">双人分离</span><span class="chip">需复核</span></div>
        生成式补全，严重损伤优先。<a href="http://ttd-edge:17877/" target="_blank" rel="noreferrer">单独打开</a>
      </div>
      <iframe src="http://ttd-edge:17877/" title="QuarkAudio-UniSE" loading="lazy"></iframe>
    </section>
  </main>
  <script>
    const buttons = document.querySelectorAll('button[data-target]');
    const panels = document.querySelectorAll('.panel');
    buttons.forEach((button) => button.addEventListener('click', () => {
      buttons.forEach((item) => item.classList.toggle('active', item === button));
      panels.forEach((panel) => panel.classList.toggle('active', panel.id === button.dataset.target));
    }));
  </script>
</body>
</html>
